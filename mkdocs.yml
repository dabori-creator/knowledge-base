site_name: Knowledge base

plugins: 
  - search
  - mkdocs-video:
      is_video: True
      video_autoplay: False
  - exclude:
      glob:
        - "*.mp4"
        - "*.pdf"

extra_css:
  - extra.css

markdown_extensions:
  - admonition 
  - pymdownx.highlight: 
      linenums: true 
      use_pygments: true
      anchor_linenums: true
      pygments_lang_class: true
      line_spans: __span
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - def_list
  - pymdownx.tasklist:
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.smartsymbols

theme:
  name: material
  language: en
  font: false
  features: 
    - content.code.copy
    - content.code.select
  palette: 
  - media: "(prefers-color-scheme: light)" 
    scheme: default 
    toggle: 
      icon: material/weather-night 
      name: Dark theme
    primary: red
  - media: "(prefers-color-scheme: dark)" 
    scheme: slate
    toggle: 
      icon: material/weather-sunny
      name: Light theme
    primary: red

extra:
  generator: false

copyright: Made for the requirements of the department PTK
